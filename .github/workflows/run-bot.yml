name: Run Xymbot

on:
  workflow_dispatch: # Allows you to run this workflow manually from the Actions tab
  schedule:
    - cron: "0 */5 * * *" # Automatically restarts every 5 hours to beat the 6-hour limit

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20' # Baileys requires Node 20+

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Dependencies
        run: npm install

      - name: Create Session
        run: |
          mkdir -p session
          echo "${{ secrets.SESSION_ID }}" | base64 -d > session/creds.json
        if: env.SESSION_ID != ''
        env:
          SESSION_ID: ${{ secrets.SESSION_ID }}

      - name: Start the Bot
        run: npm start
        env:
          # If users want to use GitHub Secrets instead of config.js, they can put keys here
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
